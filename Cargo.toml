[package]
name = "alpha-lang"
version = "0.1.0"
edition = "2024"
default-run = "alpha"

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wry = "0.57.1"
tao = "0.37.2"

[[bin]]
name = "alpha"
path = "src/main.rs"

[[bin]]
name = "alpha-lsp"
path = "src/bin/alpha_lsp.rs"
